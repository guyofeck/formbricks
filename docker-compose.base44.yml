name: formbricks-base44

services:
  postgres:
    image: pgvector/pgvector:pg18
    volumes:
      - postgres:/var/lib/postgresql
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    command: >
      postgres -c shared_preload_libraries=vector
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  valkey:
    image: valkey/valkey:8
    command: "valkey-server --maxmemory-policy noeviction"
    ports:
      - "6379:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: arjenz/mailhog
    ports:
      - "8025:8025"
      - "1025:1025"

  rustfs-perms:
    image: busybox:1.36.1
    user: "0:0"
    command: ["sh", "-c", "mkdir -p /data && chown -R 10001:10001 /data"]
    volumes:
      - rustfs-data:/data

  rustfs:
    image: rustfs/rustfs:1.0.0-alpha.93
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    command: /data
    environment:
      RUSTFS_ACCESS_KEY: devrustfs
      RUSTFS_SECRET_KEY: devrustfs123
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs-data:/data

  rustfs-init:
    image: minio/mc:latest
    depends_on:
      - rustfs
    environment:
      RUSTFS_ADMIN_USER: devrustfs
      RUSTFS_ADMIN_PASSWORD: devrustfs123
      RUSTFS_BUCKET_NAME: formbricks
      RUSTFS_POLICY_NAME: formbricks-policy
      RUSTFS_SERVICE_USER: devrustfs-service
      RUSTFS_SERVICE_PASSWORD: devrustfs-service123
      RUSTFS_CORS_ALLOWED_ORIGINS: "http://localhost:3000,https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
    volumes:
      - ./docker/rustfs-init.sh:/usr/local/bin/rustfs-init.sh:ro
    entrypoint:
      - /bin/sh
      - /usr/local/bin/rustfs-init.sh

  hub-db-create:
    image: pgvector/pgvector:pg18
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ "$$(psql "$$POSTGRES_DATABASE_URL" -tAc "SELECT 1 FROM pg_database WHERE datname = 'hub'")" != "1" ]; then
          psql "$$POSTGRES_DATABASE_URL" -v ON_ERROR_STOP=1 -c "CREATE DATABASE hub";
        fi
    environment:
      POSTGRES_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  hub-migrate:
    image: ghcr.io/formbricks/hub:0.8.4
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        if [ -x /usr/local/bin/goose ] && [ -x /usr/local/bin/river ]; then
          /usr/local/bin/goose -dir /app/migrations postgres "$$DATABASE_URL" up && /usr/local/bin/river migrate-up --database-url "$$DATABASE_URL";
        else
          echo 'Migration tools (goose/river) not in image.'; exit 1;
        fi
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hub?sslmode=disable
    depends_on:
      hub-db-create:
        condition: service_completed_successfully

  hub:
    image: ghcr.io/formbricks/hub:0.8.4
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      API_KEY: dev-api-key
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hub?sslmode=disable
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hub
      PGSSLMODE: disable

  hub-worker:
    image: ghcr.io/formbricks/hub:0.8.4
    depends_on:
      hub-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    entrypoint: ["/app/hub-worker"]
    healthcheck:
      disable: true
    environment:
      API_KEY: dev-api-key
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hub?sslmode=disable
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: hub
      PGSSLMODE: disable

  cube:
    image: cubejs/cube:v1.6.6
    depends_on:
      postgres:
        condition: service_healthy
      hub-migrate:
        condition: service_completed_successfully
    ports:
      - "4000:4000"
      - "4001:4001"
    environment:
      CUBEJS_DB_TYPE: postgres
      CUBEJS_DB_HOST: postgres
      CUBEJS_DB_NAME: postgres
      CUBEJS_DB_USER: postgres
      CUBEJS_DB_PASS: postgres
      CUBEJS_DB_PORT: "5432"
      CUBEJS_DEV_MODE: "true"
      CUBEJS_API_SECRET: "${CUBEJS_API_SECRET}"
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      CUBEJS_DEFAULT_API_SCOPES: meta,data
      CUBEJS_CACHE_AND_QUEUE_DRIVER: memory
    command:
      - sh
      - -c
      - |
        if [ -z "$$CUBEJS_API_SECRET" ]; then
          echo "CUBEJS_API_SECRET is required for Cube JWT authentication" >&2
          exit 1
        fi
        exec cubejs server
    volumes:
      - ./docker/cube/cube.js:/cube/conf/cube.js:ro
      - ./docker/cube/schema:/cube/conf/model:ro
    restart: on-failure

  # One-shot: install dependencies and run DB migrations
  web-setup:
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?schema=public
    command:
      - sh
      - -c
      - |
        set -e
        apk add --no-cache openssl python3 make g++
        npm install -g corepack@0.35.0
        corepack enable
        corepack prepare pnpm@11.7.0 --activate
        # Install only if node_modules doesn't exist yet
        if [ ! -d "node_modules/.pnpm" ]; then
          pnpm install --frozen-lockfile
        fi
        # Build all workspace packages that apps/web depends on
        npx turbo run build --filter=@formbricks/web^...
        # Run migrations
        cd packages/database
        node ./dist/scripts/apply-migrations.js
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:24-alpine
    working_dir: /app/apps/web
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      WEBAPP_URL: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
      NEXTAUTH_URL: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY}"
      CRON_SECRET: "${CRON_SECRET}"
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/postgres?schema=public
      REDIS_URL: redis://valkey:6379
      MAIL_FROM: noreply@example.com
      MAIL_FROM_NAME: Formbricks
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_SECURE_ENABLED: "0"
      SMTP_USER: smtpUser
      SMTP_PASSWORD: smtpPassword
      EMAIL_VERIFICATION_DISABLED: "1"
      PASSWORD_RESET_DISABLED: "1"
      S3_ACCESS_KEY: devrustfs-service
      S3_SECRET_KEY: devrustfs-service123
      S3_REGION: us-east-1
      S3_BUCKET_NAME: formbricks
      S3_ENDPOINT_URL: http://rustfs:9000
      S3_FORCE_PATH_STYLE: "1"
      HUB_API_KEY: dev-api-key
      HUB_API_URL: http://hub:8080
      CUBEJS_API_URL: http://cube:4000
      CUBEJS_API_SECRET: "${CUBEJS_API_SECRET}"
      CUBEJS_JWT_ISSUER: formbricks-web
      CUBEJS_JWT_AUDIENCE: formbricks-cube
      SHORT_URL_BASE: "https://3000-${BASE44_PUBLIC_HOST_SUFFIX}/s"
      TELEMETRY_DISABLED: "1"
      BASE44_PUBLIC_HOST_SUFFIX: "${BASE44_PUBLIC_HOST_SUFFIX}"
      NODE_ENV: development
    command:
      - sh
      - -c
      - |
        # Next.js dev with turbopack
        npx next dev -p 3000 --turbopack --hostname 0.0.0.0
    depends_on:
      web-setup:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
      hub:
        condition: service_started
      cube:
        condition: service_started

volumes:
  postgres:
    driver: local
  valkey-data:
    driver: local
  rustfs-data:
    driver: local
